<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매니저 호프데이 · 운영자</title><link rel="stylesheet" href="/style.css"><body data-page="admin"><main><header><div><h1>호프데이 운영</h1><p>행사 날짜 미정 · 추첨 결과는 서버에 저장됩니다.</p></div><img class="brand" src="/logo.png" alt="KG 이니시스" width="1000" height="390"></header><div id="loginCard" class="admin-panel"><h2>운영자 로그인</h2><form id="loginForm"><label for="password">운영자 비밀번호</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button type="submit" class="primary">로그인</button></form></div><div id="adminContent" hidden><div class="admin-panel"><div class="controls"><span class="badge" id="registrationState"></span><h2 id="total"></h2><button id="openRegistration">접수 열기</button><button id="closeRegistration" class="primary">접수 마감</button><a href="/display" target="_blank" rel="noopener">빔 화면 열기 ↗</a><a href="/qr.png" download="hope-day-qr.png">QR PNG 저장</a><button id="logout">로그아웃</button></div><div id="liveStatus" class="statusline" role="status"></div><h3>최근 접수 3명</h3><ul id="adminRecent"></ul></div><div class="admin-panel"><h2>추첨 진행</h2><div class="controls"><label for="rank">등수</label><select id="rank"><option value="4">4등 · 3명</option><option value="3">3등 · 3명</option><option value="2">2등 · 5명</option><option value="1">1등 · 1명</option></select><button id="openDraw">추첨 화면 열기</button><button id="pick" class="primary">당첨자 뽑기</button><button id="back">대기화면으로</button></div><label for="prize">선택 등수 상품명</label><input id="prize" maxlength="80" placeholder="상품 미정"><button id="savePrize">상품명 저장</button><p id="drawInfo"></p><ul id="adminWinners"></ul><p id="resultAudit" role="status"></p></div><p class="notice">접수를 마감한 뒤 선택한 등수의 추첨 화면을 열고 실행하세요. 같은 등수는 저장된 당첨자가 다시 표시됩니다. 등수 간 중복 당첨은 차단됩니다. 초기화 버튼은 제공하지 않습니다.</p></div><p id="message" class="error" role="status"></p></main><script src="/app.js" defer></script></body></html>
