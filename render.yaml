services:
  - type: web
    name: hope-day-raffle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PHONE_HMAC_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
