<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매니저 호프데이 · 참가 접수</title><link rel="stylesheet" href="/style.css"><body data-page="join"><main class="mobile"><header><div><h1>매니저<br>호프데이</h1><p>오늘의 행운, 함께 기다려요 🎁</p></div><img class="brand" src="/logo.png" alt="KG 이니시스" width="1000" height="390"></header><article id="joinCard"><span class="badge" id="joinStatus">접수 상태 확인 중</span><h2>추첨 참가 접수</h2><form id="joinForm"><label for="nickname">별명</label><input id="nickname" name="nickname" autocomplete="nickname" maxlength="16" required placeholder="현장에서 불릴 별명"><label for="phone">휴대폰 번호 전체</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" required placeholder="010-1234-5678"><p class="notice">동일한 휴대폰 번호는 한 번만 접수할 수 있습니다. 별명과 번호 끝 4자리가 현장 빔 화면에 표시됩니다. 전체 번호는 전송 중 처리한 뒤 저장하지 않으며, 중복 확인값과 끝 4자리만 보관합니다. 문자 본인 인증은 하지 않습니다.</p><label><input id="consent" type="checkbox" required>위의 접수 및 현장 표시 안내에 동의합니다.</label><button type="submit" id="joinButton" disabled>접수하기</button></form></article><article id="receiptCard" hidden><span class="badge">참가 완료</span><h2>나의 응모번호</h2><div class="success receipt-number" id="receiptNumber"></div><p id="receiptLabel"></p><p class="notice">이 화면을 캡처해 주세요. 당첨 시 운영자에게 응모번호를 보여 주세요. 이 휴대폰에서는 새로고침해도 접수증을 확인할 수 있습니다.</p></article><p id="message" role="status" class="error"></p></main><script src="/app.js" defer></script></body></html>
